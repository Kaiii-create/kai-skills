operations:
  analyze_image: [vision_analysis]
  select_subject: [subject_selection, semantic_selection, mask]
  remove_blemish: [healing, blemish_removal, localized_instruct_edit]
  tone_color: [tone_adjustment, color_adjustment, localized_adjustment]
  crop_resize: [crop, resize, smart_crop]
  straighten: [straighten, perspective_correction]
  background_solid: [remove_background, mask, solid_fill]
  background_replace: [mask, generative_background, instruct_edit]
  remove_object: [object_removal, generative_fill, instruct_edit]
  wardrobe_edit: [instruct_edit, generative_fill]
  hair_repair: [localized_instruct_edit, generative_fill]
  face_body_shape: [localized_geometry, liquify_like, localized_instruct_edit]
  blur_background: [lens_blur, depth_blur]

  restore_photo:
    preferred:
      - healing
      - denoise
      - tone_color
      - scratch_removal
      - localized_adjustment
      - local_inpainting
    restricted:
      - localized_reconstruction
      - localized_instruct_edit
    forbidden_default:
      - full_face_regeneration
      - full_subject_regeneration
      - identity_reinterpretation
      - unconstrained_face_enhancement

restoration_policy:
  identity_priority: highest
  source_pixels_authoritative: true
  preserve_intact_identity_pixels: true
  smallest_feasible_edit_region: true
  prefer_softness_over_invented_detail: true
  allow_full_face_regeneration: false
  allow_full_subject_regeneration: false
  reconstruction:
    scope: damaged_regions_only
    require_source_evidence: true
    low_confidence_behavior: preserve_softness_or_ambiguity
    rollback_on_identity_drift: true

preference: deterministic_first
